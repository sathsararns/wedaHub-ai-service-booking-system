[project]
name = "ai-service"
version = "0.1.0"
description = "WedaHub AI assistant for provider search and service bookings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.140.0",
    "fastembed>=0.8.1",
    "langchain>=1.3.14",
    "langchain-core>=1.5.1",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.9",
    "motor>=3.7.1",
    "numpy>=2.2.6",
    "pydantic>=2.13.4",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "uvicorn>=0.51.0",
]

[tool.ruff]
target-version = "py310"
extend-exclude = ["experiments"]
